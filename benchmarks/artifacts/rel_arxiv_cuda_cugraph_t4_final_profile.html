<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Relational sampler aggregate phase profile</title>
<style>
body { font-family: Arial, sans-serif; margin: 24px; color: #18202a; }
.run { margin: 20px 0 30px; } .bar { display: flex; height: 34px; }
.phase { min-width: 1px; box-sizing: border-box; border-right: 1px solid #fff;
  padding: 9px 4px; overflow: hidden; white-space: nowrap; font-size: 12px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.swatch { display: inline-block; width: 12px; height: 12px;
  margin-right: 4px; }
</style><body><h1>CUDA relational sampler aggregate phase profile</h1>
<p>Each segment is an independently computed median, arranged in data-flow
order. This is a flamegraph-like latency breakdown, not a single-request
execution timeline. Synchronization/other is the synchronized wall-clock
residual from the profiled call.</p><div id="root"></div>
<script>const payload = {"mode": "cuda", "runs": [{"label": "fanout=[16], batch=1", "public_latency_ms": 16.146061500000002, "profiled_latency_ms": 16.5409595, "phases_ms": {"task_to_seed_join_ms": 0.33243200182914734, "neighbor_sampling_ms": 13.978639960289001, "temporal_top_k_ms": 0.7291519939899445, "output_assembly_ms": 1.1328799724578857, "synchronization_other_ms": 0.3697733636550904}}, {"label": "fanout=[16], batch=128", "public_latency_ms": 17.5924235, "profiled_latency_ms": 18.0115135, "phases_ms": {"task_to_seed_join_ms": 0.32844799757003784, "neighbor_sampling_ms": 14.652896016836166, "temporal_top_k_ms": 0.7409279942512512, "output_assembly_ms": 1.8835359811782837, "synchronization_other_ms": 0.36113307494163394}}, {"label": "fanout=[16], batch=1024", "public_latency_ms": 19.969457, "profiled_latency_ms": 20.0784135, "phases_ms": {"task_to_seed_join_ms": 0.3078079968690872, "neighbor_sampling_ms": 16.635919839143753, "temporal_top_k_ms": 0.9199199974536896, "output_assembly_ms": 1.8361279964447021, "synchronization_other_ms": 0.3514598509178164}}, {"label": "fanout=[16], batch=4096", "public_latency_ms": 23.0021345, "profiled_latency_ms": 22.768735999999997, "phases_ms": {"task_to_seed_join_ms": 0.31596799194812775, "neighbor_sampling_ms": 19.089568614959717, "temporal_top_k_ms": 1.1143360137939453, "output_assembly_ms": 1.8826079964637756, "synchronization_other_ms": 0.34813530388069047}}, {"label": "fanout=[16], batch=8192", "public_latency_ms": 27.797179999999997, "profiled_latency_ms": 28.89046, "phases_ms": {"task_to_seed_join_ms": 0.36027200520038605, "neighbor_sampling_ms": 24.627967178821564, "temporal_top_k_ms": 1.5106720328330994, "output_assembly_ms": 1.999184012413025, "synchronization_other_ms": 0.40569196495246906}}, {"label": "fanout=[16, 16], batch=1", "public_latency_ms": 29.4289375, "profiled_latency_ms": 30.482704, "phases_ms": {"task_to_seed_join_ms": 0.35624000430107117, "neighbor_sampling_ms": 27.106527417898178, "temporal_top_k_ms": 1.4857759773731232, "output_assembly_ms": 1.1935360431671143, "synchronization_other_ms": 0.3993149350376122}}, {"label": "fanout=[16, 16], batch=128", "public_latency_ms": 33.3907825, "profiled_latency_ms": 34.057165, "phases_ms": {"task_to_seed_join_ms": 0.3502559959888458, "neighbor_sampling_ms": 29.270303428173065, "temporal_top_k_ms": 1.49713596701622, "output_assembly_ms": 2.6675360202789307, "synchronization_other_ms": 0.3943554766511923}}, {"label": "fanout=[16, 16], batch=1024", "public_latency_ms": 45.559512, "profiled_latency_ms": 45.5736555, "phases_ms": {"task_to_seed_join_ms": 0.3437120020389557, "neighbor_sampling_ms": 40.377103835344315, "temporal_top_k_ms": 1.877407968044281, "output_assembly_ms": 2.58843195438385, "synchronization_other_ms": 0.3859885443897255}}, {"label": "fanout=[16, 16], batch=4096", "public_latency_ms": 71.500347, "profiled_latency_ms": 70.97250600000001, "phases_ms": {"task_to_seed_join_ms": 0.3530239909887314, "neighbor_sampling_ms": 65.22534281015396, "temporal_top_k_ms": 2.4196799993515015, "output_assembly_ms": 2.6645439863204956, "synchronization_other_ms": 0.3925426561384242}}, {"label": "fanout=[16, 16], batch=8192", "public_latency_ms": 113.50797299999999, "profiled_latency_ms": 114.2208325, "phases_ms": {"task_to_seed_join_ms": 0.3628479987382889, "neighbor_sampling_ms": 107.16655719280243, "temporal_top_k_ms": 3.551024079322815, "output_assembly_ms": 2.724128007888794, "synchronization_other_ms": 0.40194114874839926}}, {"label": "fanout=[-1], batch=8", "public_latency_ms": 14.51644, "profiled_latency_ms": 14.800389, "phases_ms": {"task_to_seed_join_ms": 0.318448007106781, "neighbor_sampling_ms": 12.280687808990479, "output_assembly_ms": 1.8280960321426392, "synchronization_other_ms": 0.34557299793529506}}]};
const colors = ['#1677b8','#24a37b','#df8b27','#9a5fb4','#607d8b'];
const root = document.getElementById('root');
payload.runs.forEach((run) => {
  const total = Object.values(run.phases_ms).reduce((a, b) => a + b, 0);
  const item = document.createElement('section'); item.className = 'run';
  const publicLatency = run.public_latency_ms.toFixed(3);
  const profiledLatency = run.profiled_latency_ms.toFixed(3);
  item.innerHTML = `<h2>${run.label}</h2>`
    + `<p>Public sampler median: ${publicLatency} ms; `
    + `profiled-call median: ${profiledLatency} ms; `
    + `sum of phase medians: ${total.toFixed(3)} ms</p>`;
  const bar = document.createElement('div'); bar.className = 'bar';
  const legend = document.createElement('div'); legend.className = 'legend';
  Object.entries(run.phases_ms).forEach(([name, ms], index) => {
    const color = colors[index % colors.length];
    const width = 100 * ms / total;
    const part = document.createElement('div'); part.className = 'phase';
    part.style.width = `${width}%`; part.style.background = color;
    part.title = `${name}: ${ms.toFixed(3)} ms`;
    part.textContent = `${name}`;
    bar.appendChild(part);
    const key = document.createElement('span');
    key.innerHTML = `<i class="swatch" style="background:${color}"></i>`
      + `${name}: ${ms.toFixed(3)} ms`;
    legend.appendChild(key);
  }); item.append(bar, legend); root.appendChild(item);
});</script></body></html>
