<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Relational sampler aggregate phase profile</title>
<style>
body { font-family: Arial, sans-serif; margin: 24px; color: #18202a; }
.run { margin: 20px 0 30px; } .bar { display: flex; height: 34px; }
.phase { min-width: 1px; box-sizing: border-box; border-right: 1px solid #fff;
  padding: 9px 4px; overflow: hidden; white-space: nowrap; font-size: 12px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.swatch { display: inline-block; width: 12px; height: 12px;
  margin-right: 4px; }
</style><body><h1>CUDA relational sampler aggregate phase profile</h1>
<p>Each segment is an independently computed median, arranged in data-flow
order. This is a flamegraph-like latency breakdown, not a single-request
execution timeline. Synchronization/other is the synchronized wall-clock
residual from the profiled call.</p><div id="root"></div>
<script>const payload = {"mode": "cuda", "runs": [{"label": "fanout=[16], batch=1", "public_latency_ms": 24.101243, "profiled_latency_ms": 24.101243, "phases_ms": {"task_to_seed_join_ms": 8.035151958465576, "neighbor_sampling_ms": 13.723247796297073, "temporal_top_k_ms": 0.7459520101547241, "output_assembly_ms": 1.128719985485077, "synchronization_other_ms": 0.4356676504173276}}, {"label": "fanout=[16], batch=128", "public_latency_ms": 26.7005445, "profiled_latency_ms": 26.7005445, "phases_ms": {"task_to_seed_join_ms": 8.689695835113525, "neighbor_sampling_ms": 14.899344027042389, "temporal_top_k_ms": 0.7529440224170685, "output_assembly_ms": 1.8905760049819946, "synchronization_other_ms": 0.4477353399353028}}, {"label": "fanout=[16], batch=1024", "public_latency_ms": 29.811778, "profiled_latency_ms": 29.811778, "phases_ms": {"task_to_seed_join_ms": 8.829376220703125, "neighbor_sampling_ms": 17.48504000902176, "temporal_top_k_ms": 0.9696159958839417, "output_assembly_ms": 1.91702401638031, "synchronization_other_ms": 0.46604030535888796}}, {"label": "fanout=[16, 16], batch=1", "public_latency_ms": 45.1851225, "profiled_latency_ms": 45.1851225, "phases_ms": {"task_to_seed_join_ms": 9.024864196777344, "neighbor_sampling_ms": 30.63030433654785, "temporal_top_k_ms": 1.7230879962444305, "output_assembly_ms": 1.2165120244026184, "synchronization_other_ms": 0.475115469764706}}, {"label": "fanout=[16, 16], batch=128", "public_latency_ms": 42.527463, "profiled_latency_ms": 42.527463, "phases_ms": {"task_to_seed_join_ms": 8.731856346130371, "neighbor_sampling_ms": 29.138399958610535, "temporal_top_k_ms": 1.5255520343780518, "output_assembly_ms": 2.6663520336151123, "synchronization_other_ms": 0.47305105020141625}}, {"label": "fanout=[16, 16], batch=1024", "public_latency_ms": 56.7050205, "profiled_latency_ms": 56.7050205, "phases_ms": {"task_to_seed_join_ms": 9.066847801208496, "neighbor_sampling_ms": 42.37334340810776, "temporal_top_k_ms": 1.9906080067157745, "output_assembly_ms": 2.6713759899139404, "synchronization_other_ms": 0.4596772733230594}}, {"label": "fanout=[-1], batch=8", "public_latency_ms": 22.946966500000002, "profiled_latency_ms": 22.946966500000002, "phases_ms": {"task_to_seed_join_ms": 8.227888107299805, "neighbor_sampling_ms": 12.253119945526123, "output_assembly_ms": 1.9243680238723755, "synchronization_other_ms": 0.4761309503593445}}]};
const colors = ['#1677b8','#24a37b','#df8b27','#9a5fb4','#607d8b'];
const root = document.getElementById('root');
payload.runs.forEach((run) => {
  const total = Object.values(run.phases_ms).reduce((a, b) => a + b, 0);
  const item = document.createElement('section'); item.className = 'run';
  const publicLatency = run.public_latency_ms.toFixed(3);
  const profiledLatency = run.profiled_latency_ms.toFixed(3);
  item.innerHTML = `<h2>${run.label}</h2>`
    + `<p>Public sampler median: ${publicLatency} ms; `
    + `profiled-call median: ${profiledLatency} ms; `
    + `sum of phase medians: ${total.toFixed(3)} ms</p>`;
  const bar = document.createElement('div'); bar.className = 'bar';
  const legend = document.createElement('div'); legend.className = 'legend';
  Object.entries(run.phases_ms).forEach(([name, ms], index) => {
    const color = colors[index % colors.length];
    const width = 100 * ms / total;
    const part = document.createElement('div'); part.className = 'phase';
    part.style.width = `${width}%`; part.style.background = color;
    part.title = `${name}: ${ms.toFixed(3)} ms`;
    part.textContent = `${name}`;
    bar.appendChild(part);
    const key = document.createElement('span');
    key.innerHTML = `<i class="swatch" style="background:${color}"></i>`
      + `${name}: ${ms.toFixed(3)} ms`;
    legend.appendChild(key);
  }); item.append(bar, legend); root.appendChild(item);
});</script></body></html>
