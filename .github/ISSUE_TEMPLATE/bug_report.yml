name: 🐛 Bug Report
description: Create a report to help us reproduce and fix the bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        #### Before submitting, please review the [contributing guidelines](https://github.com/Nvidia/structured-data-models/blob/main/CONTRIBUTING.md) and [AI policy](https://github.com/Nvidia/structured-data-models/blob/main/AGENTS.md#ai-policy). Issues that do not follow these practices may be closed.
  - type: markdown
    attributes:
      value: >
        #### Before submitting a bug, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/Nvidia/structured-data-models/issues?q=is%3Aissue+sort%3Acreated-desc+). If possible, check whether the issue also reproduces on the latest `main`, as it may already be fixed.
  - type: textarea
    attributes:
      label: 🐛 Describe the bug
      description: |
        Please provide a clear and concise description of what the bug is.

        If relevant, add a minimal example so that we can reproduce the error by running the code. It is very important for the snippet to be as succinct (minimal) as possible, so please take time to trim down any irrelevant code to help us debug efficiently.
        Your example should be fully self-contained: use synthetic or publicly available data, and include any required checkpoint name or revision.
        For example:

        ```python
        # All necessary imports at the beginning
        import torch
        import sdm

        # A succinct reproducing example trimmed down to the essential parts:
        ...
        ```

        Please also paste or describe the results you observe instead of the expected results. If you observe an error, please paste the error message including the **full** traceback of the exception. It may be relevant to wrap error messages in ```` ```triple quotes blocks``` ````.
      placeholder: |
        A clear and concise description of what the bug is.

        ```python
        # Sample code to reproduce the problem
        ```

        ```
        The error message you got, with the full traceback.
        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: Versions
      description: |
        Please include your structured-data-models version or Git commit and how you installed it (for example, pip, an editable source checkout, or a container image and tag).
        Then run the following in the affected environment and paste the output below:
        ```sh
        python -m torch.utils.collect_env
        ```
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉!
