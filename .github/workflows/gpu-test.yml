name: GPU Test

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - 'pull-request/[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pytest-gpu:
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for ci-full-test label
        id: ci-full-test-label
        if: startsWith(github.ref_name, 'pull-request/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          result-encoding: string
          script: |
            const pullNumber = Number(context.ref.split('/').at(-1));
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            return pull.labels.some(({ name }) => name === 'ci-full-test');

      - name: Set up proxy cache
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Route uv through the proxy cache
        run: |
          if [ -n "${PIP_INDEX_URL:-}" ]; then
            echo "UV_DEFAULT_INDEX=${PIP_INDEX_URL}" >> "${GITHUB_ENV}"
          fi

      - name: Install package
        run: |
          uv pip install --torch-backend=cu130 '.[test]' cudf-cu13

      - name: GPU sanity check
        run: |
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA not available to torch'"
          python -c "import cudf; print('cudf', cudf.__version__)"

      - name: Run tests
        env:
          FULL_TEST: ${{ (github.ref_name == 'main' || steps.ci-full-test-label.outputs.result == 'true') && '1' || '0' }}
        run: |
          pytest -m cuda -rs --durations=25
