name: Test

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}  # yamllint disable-line
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: '3.10'
          activate-environment: true

      - name: Install package
        run: |
          uv pip install --torch-backend=cpu -e '.[test]'

      - name: Run tests
        run: |
          pytest --cov=sdm --cov-config=pyproject.toml --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Summarize code coverage
        if: always()
        continue-on-error: true
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          lower = 80.0
          upper = 90.0
          marker = "<!-- coverage-report -->"
          coverage_path = Path("coverage.xml")

          def pct(value):
              return float(value or 0) * 100

          def health(value):
              if value < lower:
                  return "Fail"
              if value < upper:
                  return "Warn"
              return "Pass"

          def badge_color(value):
              if value < lower:
                  return "critical"
              if value < upper:
                  return "yellow"
              return "success"

          if not coverage_path.exists():
              Path("code-coverage-results.md").write_text(
                  f"{marker}\nCoverage summary was not generated.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          root = ET.parse(coverage_path).getroot()
          total = pct(root.get("line-rate"))
          color = badge_color(total)
          total_label = f"{total:.0f}%"
          badge = (
              "![Code Coverage]"
              f"(https://img.shields.io/badge/Code%20Coverage-{total_label}-{color}?style=flat)"
          )

          lines = [
              marker,
              badge,
              "",
              "| Package | Line Rate | Branch Rate | Health |",
              "| ------- | --------- | ----------- | ------ |",
          ]

          packages = root.findall(".//package")
          for package in packages:
              name = package.get("name") or "root"
              line_rate = pct(package.get("line-rate"))
              branch_rate = pct(package.get("branch-rate"))
              lines.append(
                  f"| {name} | {line_rate:.0f}% | {branch_rate:.0f}% | {health(line_rate)} |"
              )

          lines.append(
              f"| **TOTAL** | **{total:.0f}%** | **{pct(root.get('branch-rate')):.0f}%** | **{health(total)}** |"
          )
          lines.append("")
          Path("code-coverage-results.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

      - name: Print coverage in job summary
        if: always()
        continue-on-error: true
        run: |
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! -f code-coverage-results.md ]]; then
            echo "Coverage summary was not generated." > code-coverage-results.md
          fi

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- coverage-report -->"))) | .id' \
              | tail -n 1
          )"

          jq -Rs '{body: .}' code-coverage-results.md > coverage-comment.json

          if [[ -n "$comment_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --method PATCH \
              --input coverage-comment.json
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --method POST \
              --input coverage-comment.json
          fi
