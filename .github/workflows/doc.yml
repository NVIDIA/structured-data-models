name: Documentation

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write  # gh-pages push

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ startsWith(github.ref, 'refs/pull/') || github.run_number }}  # yamllint disable-line
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  make_html:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: '3.11'
          activate-environment: true

      - name: Install package
        run: |
          uv pip install --torch-backend=cpu --group=doc .

      - name: Build documentation
        working-directory: ./docs
        run: |
          uv run --no-project sphinx-build -M html "source" "build" -W --keep-going

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation
          path: docs/build/html
          retention-days: 1

      - name: Run doctests
        working-directory: ./docs
        run: |
          uv run --no-project sphinx-build -M doctest "source" "build" -W --keep-going

      - name: Push documentation to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
