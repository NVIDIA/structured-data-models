[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-data-models"
dynamic = ["version"]
description = "Foundation Models for Structured Data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "NVIDIA" },
]
maintainers = [
    { name = "NVIDIA" },
]
keywords = [
    "artificial intelligence",
    "foundation models",
    "machine learning",
    "nvidia",
    "schema",
    "structured data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch",
    "numpy",
    "pyarrow",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pandas",
]

[project.urls]
Download = "https://github.com/NVIDIA/structured-data-models/releases"
Homepage = "https://github.com/NVIDIA/structured-data-models"
Repository = "https://github.com/NVIDIA/structured-data-models"
Issues = "https://github.com/NVIDIA/structured-data-models/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdm*"]

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"

[tool.uv]
package = true
exclude-newer = "7 days"

[tool.pytest.ini_options]
addopts = [
    "--capture=no",
    "--color=yes",
    "-vv",
    "--import-mode=importlib",
]
testpaths = ["test"]
xfail_strict = true

[tool.ruff]  # https://docs.astral.sh/ruff/rules
src = ["pyproject.toml", "sdm", "test"]
line-length = 79
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",    # bugbear
    "BLE",  # blind-except
    "C4",   # comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "NPY",  # numpy-specific rules
    "PIE",  # flake8-pie
    "PT",   # pytest style
    "RET",  # return statement style
    "RUF",  # ruff-specific rules
    "SIM",  # simplification
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # flake8-2020
]
ignore = [
    "B905",  # Ignore "zip() without explicit `strict`"
    "D100",  # Ignore "Missing docstring in public module"
    "D105",  # Ignore "missing docstring in magic method"
    "D107",  # Ignore "missing docstring in __init__"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["I"]
"test/**/*.py" = [
    "D101",  # Ignore "Missing docstring in public class"
    "D102",  # Ignore "Missing docstring in public method"
    "D103",  # Ignore "Missing docstring in public function"
    "D104",  # Ignore "Missing docstring in public package"
    "D106",  # Ignore "Missing docstring in public nested class"
]
# TODO: Address these ignores
"sdm/tensor/*.py" = [
    "D101",  # Ignore "Missing docstring in public class"
    "D102",  # Ignore "Missing docstring in public method"
]
