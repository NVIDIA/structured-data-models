[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-fm"
dynamic = ["version"]
description = "Foundation Models for Structured Data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "NVIDIA" },
]
maintainers = [
    { name = "NVIDIA" },
]
keywords = [
    "artificial intelligence",
    "foundation models",
    "machine learning",
    "nvidia",
    "schema",
    "structured data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Download = "https://github.com/NVIDIA/schema-fm/releases"
Homepage = "https://github.com/NVIDIA/schema-fm"
Repository = "https://github.com/NVIDIA/schema-fm"
Issues = "https://github.com/NVIDIA/schema-fm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["schemafm*"]

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"

[tool.uv]
package = true
exclude-newer = "7 days"

[tool.pytest.ini_options]
addopts = [
    "--capture=no",
    "--color=yes",
    "-vv",
    "--import-mode=importlib",
]
testpaths = ["test"]
xfail_strict = true
